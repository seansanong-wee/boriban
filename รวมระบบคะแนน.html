<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รวมระบบคะแนน</title>
    <link rel="icon" href="assets/logo.jpg">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #0f172a;
        }

        .app-shell {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .app-menu {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex: 0 0 220px;
            flex-direction: column;
            min-height: 100vh;
            padding: 18px 14px;
            border-right: 1px solid #991b1b;
            background: linear-gradient(180deg, #b91c1c 0%, #dc2626 48%, #7f1d1d 100%);
            box-shadow: 10px 0 28px rgba(127, 29, 29, 0.22);
        }

        .app-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 0 0 16px;
            padding: 0 6px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.28);
            text-align: center;
        }

        .app-logo {
            width: 112px;
            height: 112px;
            border: 3px solid rgba(255, 255, 255, 0.82);
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 12px 24px rgba(69, 10, 10, 0.26);
            object-fit: cover;
        }

        .app-title {
            margin: 0;
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            line-height: 1.35;
        }

        .app-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .app-nav button {
            width: 100%;
            min-height: 44px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            text-align: left;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .app-nav button:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
        }

        .app-nav button.active {
            background: #ffffff;
            color: #991b1b;
            box-shadow: 0 8px 18px rgba(69, 10, 10, 0.28);
        }

        .app-content {
            display: flex;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 100vh;
        }

        .app-frame {
            display: block;
            width: 100%;
            min-height: 100vh;
            border: 0;
            background: #ffffff;
        }

        @media (max-width: 760px) {
            .app-shell {
                flex-direction: column;
            }

            .app-menu {
                flex: none;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #991b1b;
                box-shadow: 0 10px 28px rgba(127, 29, 29, 0.18);
            }

            .app-brand {
                margin-bottom: 12px;
                padding-bottom: 10px;
            }

            .app-logo {
                width: 84px;
                height: 84px;
            }

            .app-nav {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .app-nav button {
                text-align: center;
            }

            .app-frame {
                min-height: calc(100vh - 236px);
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="app-menu" aria-label="เลือกหน้าระบบคะแนน">
            <div class="app-brand">
                <img class="app-logo" src="assets/logo.jpg" alt="โรงเรียนอรัญภูมิบริบาล">
                <h1 class="app-title">รวมระบบคะแนน</h1>
            </div>
            <nav class="app-nav">
                <button type="button" class="active" onclick="switchApp('NA/tast_1.HTML', this)">Tast 1</button>
                <button type="button" onclick="switchApp('คะแนน 2/tast_2.html', this)">Tast 2</button>
                <button type="button" onclick="switchApp('Tast_3/tast_3.html', this)">Tast 3</button>
                <button type="button" onclick="switchApp('Tast_4/tast_4.html', this)">Tast 4</button>
                <button type="button" onclick="switchApp('Tast_5/tast_5.html', this)">Tast 5</button>
                <button type="button" onclick="switchApp('Practical/practical_score.html', this)">คะแนนปฏิบัติ</button>
            </nav>
        </aside>

        <main class="app-content">
            <iframe
                id="app-frame"
                class="app-frame"
                src="NA/tast_1.HTML"
                title="ระบบคะแนนที่เลือก">
            </iframe>
        </main>
    </div>

    <script>
        function switchApp(path, activeButton) {
            document.getElementById('app-frame').src = path;

            document.querySelectorAll('.app-nav button').forEach(button => {
                button.classList.toggle('active', button === activeButton);
            });
        }
    </script>
</body>
</html>
